<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TradingView · график и рисунки</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#e2e8f0;font:14px system-ui}header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:14px}a{color:#60a5fa}input,select,button{background:#1e293b;border:1px solid #64748b;border-radius:6px;color:inherit;padding:8px}p{margin:0 14px 12px;color:#94a3b8}#widget{height:calc(100vh - 128px);min-height:420px}.tradingview-widget-container{height:100%;width:100%}.tradingview-widget-container__widget{height:calc(100% - 32px);width:100%}.tradingview-widget-copyright{padding:6px;text-align:center}</style>
<header><a href="board.html">← Скринер</a><b>TradingView · рисунки и индикаторы</b><form id="settings"><input id="symbol" aria-label="Монета" maxlength="35" value="BTCUSDT"><select id="tf" aria-label="Таймфрейм"><option value="5m">5 минут</option><option value="15m">15 минут</option><option value="1h">1 час</option></select><button>Открыть</button></form></header>
<p>Инструменты рисования — слева в графике. Это официальный виджет TradingView: его рисунки не отправляются в Telegram. Для сигнальных уровней и отметок бота используйте основной график скринера.</p><div id="widget"></div>
<script>
(function(){var params=new URLSearchParams(location.search),symbol=document.getElementById('symbol'),tf=document.getElementById('tf');symbol.value=params.get('symbol')||'BTCUSDT';tf.value=['5m','15m','1h'].includes(params.get('tf'))?params.get('tf'):'15m';function load(){var coin=symbol.value.trim().toUpperCase();if(!/^[A-Z0-9]{1,30}USDT$/.test(coin)){symbol.setCustomValidity('Введите символ, например USUSDT');symbol.reportValidity();return;}symbol.setCustomValidity('');var host=document.getElementById('widget');host.replaceChildren();var container=document.createElement('div');container.className='tradingview-widget-container';var graph=document.createElement('div');graph.className='tradingview-widget-container__widget';var credit=document.createElement('div');credit.className='tradingview-widget-copyright';var link=document.createElement('a');link.href='https://www.tradingview.com/symbols/'+coin+'/?exchange=BINANCE';link.target='_blank';link.rel='noopener';link.textContent='Графики от TradingView';credit.append(link);container.append(graph,credit);host.append(container);var script=document.createElement('script');script.src='https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js';script.async=true;script.textContent=JSON.stringify({autosize:true,symbol:'BINANCE:'+coin+'.P',interval:{'5m':'5','15m':'15','1h':'60'}[tf.value],timezone:'Europe/Moscow',theme:'dark',style:'1',locale:'ru',allow_symbol_change:true,hide_side_toolbar:false,hide_top_toolbar:false,hide_volume:false,withdateranges:true,save_image:true,calendar:false,support_host:'https://www.tradingview.com'});script.onerror=function(){graph.textContent='Не удалось загрузить TradingView. Проверьте доступ к tradingview.com.';};container.append(script);history.replaceState(null,'','?symbol='+encodeURIComponent(coin)+'&tf='+tf.value);}document.getElementById('settings').onsubmit=function(e){e.preventDefault();load();};symbol.oninput=function(){symbol.setCustomValidity('');};load();})();
</script></html>
