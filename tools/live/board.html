<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Крипто-скринер</title>
<style>
:root{--bg:#0f1115;--panel:#161a21;--row:#1b2029;--line:#262c37;--txt:#e6e9ef;--mute:#8b93a3;--up:#1fbf75;--down:#ef4f5a;--flat:#6b7280;--acc:#4c8dff;--warn:#f0b429}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:13px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header h1{font-size:16px;margin:0;font-weight:700}
header nav a{color:var(--mute);text-decoration:none;margin-right:12px}
header nav a:hover,header nav a.on{color:var(--txt)}
.stamp{color:var(--mute);margin-left:auto;font-size:12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}
.bar input,.bar select{background:var(--row);color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit}
.bar input[type=search]{width:140px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{background:var(--row);color:var(--mute);border:0;padding:6px 10px;font:inherit;cursor:pointer}
.seg button.on{background:var(--acc);color:#fff}
.chk{color:var(--mute);display:inline-flex;gap:4px;align-items:center;cursor:pointer}
.summary{display:flex;gap:14px;padding:8px 16px;color:var(--mute);font-size:12px;flex-wrap:wrap}
.summary b{color:var(--txt)}
.wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:1060px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:right}
th{position:sticky;top:0;background:var(--panel);color:var(--mute);font-weight:600;font-size:12px;cursor:pointer;user-select:none}
th.l,td.l{text-align:left}
th.sorted{color:var(--txt)}
tbody tr:hover{background:var(--row)}
.coin{font-weight:700}
.coin a{color:inherit;text-decoration:none}
.up{color:var(--up)}.down{color:var(--down)}.mute{color:var(--mute)}
.tag{display:inline-block;min-width:44px;text-align:center;padding:2px 6px;border-radius:4px;font-size:11px;font-weight:700}
.tag.long{background:rgba(31,191,117,.16);color:var(--up)}
.tag.short{background:rgba(239,79,90,.16);color:var(--down)}
.tag.flat{background:rgba(107,114,128,.18);color:var(--mute)}
.tf{display:inline-flex;gap:3px}
.tf .tag{min-width:30px;padding:2px 4px;font-weight:600}
.f{display:inline-block;margin:1px 2px;padding:1px 6px;border-radius:10px;font-size:11px;background:#232a36;color:var(--txt)}
.f.long{box-shadow:inset 2px 0 0 var(--up)}.f.short{box-shadow:inset 2px 0 0 var(--down)}
.f.sig{background:#2a3350}
.dens{font-variant-numeric:tabular-nums}
.near{color:var(--warn);font-weight:700}
td{font-variant-numeric:tabular-nums}
svg.sp{display:block}
#chart{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;z-index:20}
#chart.open{display:flex;flex-direction:column}
#chart .hd{display:flex;gap:10px;align-items:center;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
#chart .hd b{font-size:15px}
#chart .hd .x{margin-left:auto;background:none;border:0;color:var(--txt);font-size:22px;cursor:pointer}
#chart .hd a{color:var(--mute)}
#chart iframe{flex:1;border:0;background:var(--bg);width:100%}
tbody tr{cursor:pointer}
.f{cursor:pointer}
footer{color:var(--mute);font-size:12px;padding:12px 16px 24px}
@media (max-width:700px){header{padding:8px 12px}.bar,.summary{padding-left:12px;padding-right:12px}}
</style>
</head>
<body>
<header>
  <h1>Крипто-скринер</h1>
  <nav>
    <a class="on" href="/">Монеты</a>
    <a href="structures.html">Графики и формации</a>
    <a href="densities.html">Плотности</a>
    <span id="bots"></span>
    <a href="index.html">Методика</a>
  </nav>
  <span class="stamp" id="stamp"></span>
</header>

<div class="bar">
  <input type="search" id="q" placeholder="Тикер…">
  <span class="seg" id="side">
    <button data-v="all" class="on">Все</button><button data-v="long">Лонг</button><button data-v="short">Шорт</button><button data-v="flat">Флэт</button>
  </span>
  <select id="tfsel" title="По какому таймфрейму фильтровать тренд">
    <option value="overall">тренд: общий</option><option value="15m">тренд: 15м</option><option value="1h">тренд: 1ч</option><option value="4h">тренд: 4ч</option>
  </select>
  <select id="vol" title="Минимальный оборот за сутки">
    <option value="0">оборот: любой</option><option value="2e8">от 200 млн</option><option value="5e8">от 500 млн</option><option value="1e9">от 1 млрд</option>
  </select>
  <label class="chk"><input type="checkbox" id="hasdens"> плотность до 1%</label>
  <label class="chk"><input type="checkbox" id="hasform"> есть формация</label>
</div>
<div class="summary" id="summary"></div>

<div class="wrap">
<table>
  <thead><tr>
    <th class="l" data-k="coin">Монета</th>
    <th data-k="price">Цена</th>
    <th data-k="ch1h">1ч %</th>
    <th data-k="ch24h">24ч %</th>
    <th data-k="volume">Оборот 24ч</th>
    <th data-k="natr">NATR 1ч</th>
    <th class="l" data-k="overall">Тренд</th>
    <th class="l" data-k="tfs">15м · 1ч · 4ч</th>
    <th data-k="dens_pct">Плотность</th>
    <th class="l" data-k="none">График 2 сут</th>
    <th class="l" data-k="nform">Формации</th>
  </tr></thead>
  <tbody id="tb"></tbody>
</table>
</div>
<footer id="foot"></footer>
<div id="chart"><div class="hd"><b id="ctitle"></b><span class="seg" id="ctf"><button data-v="5m">5м</button><button data-v="15m">15м</button><button data-v="1h">1ч</button></span><a id="cbin" target="_blank" rel="noopener">Binance ↗</a><button class="x" id="cx" title="Закрыть (Esc)">×</button></div><iframe id="cframe" title="График"></iframe></div>

<script id="data" type="application/json">__DATA__</script>
<script>
(function(){
var D = JSON.parse(document.getElementById('data').textContent);
var S = {q:'', side:'all', tf:'overall', vol:0, hasdens:false, hasform:false, k:'volume', dir:-1};
try { Object.assign(S, JSON.parse(localStorage.getItem('board') || '{}')); } catch(e) {}
function save(){ try { localStorage.setItem('board', JSON.stringify(S)); } catch(e) {} }

var SIDE = {long:'ЛОНГ', short:'ШОРТ', flat:'ФЛЭТ'};
var SIDE1 = {long:'L', short:'S', flat:'—'};
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function px(v){ if(v==null) return '—'; var a=Math.abs(v); var d = a>=1000?1:a>=100?2:a>=1?3:a>=0.01?5:7; return v.toLocaleString('ru-RU',{minimumFractionDigits:d,maximumFractionDigits:d}); }
function pct(v){ if(v==null) return '<span class="mute">—</span>'; var c=v>0?'up':v<0?'down':'mute'; return '<span class="'+c+'">'+(v>0?'+':'')+v.toFixed(2)+'%</span>'; }
function money(v){ if(v==null) return '—'; if(v>=1e9) return (v/1e9).toFixed(2)+' млрд'; if(v>=1e6) return (v/1e6).toFixed(0)+' млн'; if(v>=1e3) return (v/1e3).toFixed(0)+' тыс'; return v.toFixed(0); }
function tag(s, short){ s = s || 'flat'; return '<span class="tag '+s+'">'+(short?SIDE1[s]:SIDE[s])+'</span>'; }
function spark(xs){
  if(!xs || xs.length<2) return '';
  var w=110,h=28,mn=Math.min.apply(null,xs),mx=Math.max.apply(null,xs),r=(mx-mn)||1;
  var pts=xs.map(function(v,i){return (i*(w/(xs.length-1))).toFixed(1)+','+(h-2-(v-mn)/r*(h-4)).toFixed(1);}).join(' ');
  var col = xs[xs.length-1]>=xs[0] ? 'var(--up)' : 'var(--down)';
  return '<svg class="sp" width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'"><polyline fill="none" stroke="'+col+'" stroke-width="1.4" points="'+pts+'"/></svg>';
}
function sideOf(r){ return S.tf==='overall' ? r.overall : ((r.trend[S.tf]||{}).side || 'flat'); }
function val(r,k){
  if(k==='overall') return {long:1,flat:0,short:-1}[r.overall];
  if(k==='tfs') return ['15m','1h','4h'].reduce(function(a,t){var s=(r.trend[t]||{}).side;return a+(s==='long'?1:s==='short'?-1:0);},0);
  if(k==='nform') return r.forms.length;
  if(k==='coin') return r.coin;
  return r[k];
}

function render(){
  var rows = D.rows.filter(function(r){
    if(S.q && r.coin.toLowerCase().indexOf(S.q.toLowerCase())<0) return false;
    if(S.side!=='all' && sideOf(r)!==S.side) return false;
    if(S.vol && (r.volume||0) < S.vol) return false;
    if(S.hasdens && !(r.dens_pct!=null && r.dens_pct<=1)) return false;
    if(S.hasform && !r.forms.length) return false;
    return true;
  });
  rows.sort(function(a,b){
    var x=val(a,S.k), y=val(b,S.k);
    if(x==null && y==null) return 0; if(x==null) return 1; if(y==null) return -1;
    if(typeof x==='string') return S.dir*x.localeCompare(y);
    return S.dir*(x-y);
  });
  var html = rows.map(function(r){
    var tfs = '<span class="tf">'+['15m','1h','4h'].map(function(t){return tag((r.trend[t]||{}).side,true);}).join('')+'</span>';
    var dens = r.dens_pct==null ? '<span class="mute">—</span>' :
      '<span class="dens'+(r.dens_pct<=0.5?' near':'')+'">'+r.dens_pct.toFixed(2)+'%</span> <span class="mute">'+money(r.dens_usd)+' $</span>';
    var fs = r.forms.slice(0,3).map(function(f){
      var arrow = f.dir==='long'?' ↑':f.dir==='short'?' ↓':'';
      var tip = f.title+' на '+f.tf+(f.exp!=null?', замер '+(f.exp>0?'+':'')+f.exp+'R'+(f.sig?' (значимо)':''):'')+', свечей назад: '+f.age;
      return '<span class="f '+(f.dir||'')+(f.sig?' sig':'')+'" data-tf="'+esc(f.tf)+'" title="'+esc(tip)+'">'+esc(f.tf)+' '+esc(f.title)+arrow+'</span>';
    }).join('') + (r.forms.length>3?'<span class="mute"> +'+(r.forms.length-3)+'</span>':'');
    return '<tr data-sym="'+esc(r.symbol)+'">'+
      '<td class="l coin">'+esc(r.coin)+'</td>'+
      '<td>'+px(r.price)+'</td><td>'+pct(r.ch1h)+'</td><td>'+pct(r.ch24h)+'</td>'+
      '<td>'+money(r.volume)+'</td><td>'+(r.natr==null?'—':r.natr.toFixed(2)+'%')+'</td>'+
      '<td class="l">'+tag(r.overall)+'</td><td class="l">'+tfs+'</td>'+
      '<td>'+dens+'</td><td class="l">'+spark(r.spark)+'</td><td class="l">'+(fs||'<span class="mute">—</span>')+'</td></tr>';
  }).join('');
  document.getElementById('tb').innerHTML = html || '<tr><td colspan="11" class="l mute">Под фильтр ничего не попало</td></tr>';
  var cnt={long:0,short:0,flat:0}; D.rows.forEach(function(r){cnt[r.overall]++;});
  document.getElementById('summary').innerHTML =
    'Показано <b>'+rows.length+'</b> из '+D.rows.length+' · общий тренд: <span class="up">лонг <b>'+cnt.long+'</b></span> · <span class="down">шорт <b>'+cnt.short+'</b></span> · флэт <b>'+cnt.flat+'</b>';
  [].forEach.call(document.querySelectorAll('th'), function(th){ th.classList.toggle('sorted', th.dataset.k===S.k); });
}

document.getElementById('bots').innerHTML=(D.meta.bots||[]).map(function(b){return '<a href="'+esc(b.href)+'">'+esc(b.title)+'</a>';}).join('');
document.getElementById('stamp').textContent = 'обновлено ' + D.meta.built_at + ' · ' + D.meta.market;
document.getElementById('foot').textContent = 'Тренд: ' + D.meta.trend_rule + ' Формации — не старше ' + D.meta.fresh + ' свечей; подсвечены значимые по замеру. Плотность — ближайшая крупная заявка в стакане и расстояние до неё. Клик по строке открывает график монеты с уровнями, наклонными и формациями. Страница обновляется раз в минуту, пока график закрыт.';

var q=document.getElementById('q'); q.value=S.q; q.oninput=function(){S.q=q.value;save();render();};
[].forEach.call(document.querySelectorAll('#side button'), function(b){
  b.classList.toggle('on', b.dataset.v===S.side);
  b.onclick=function(){S.side=b.dataset.v;save();[].forEach.call(document.querySelectorAll('#side button'),function(x){x.classList.toggle('on',x===b);});render();};
});
var tfsel=document.getElementById('tfsel'); tfsel.value=S.tf; tfsel.onchange=function(){S.tf=tfsel.value;save();render();};
var vol=document.getElementById('vol'); vol.value=String(S.vol||0); vol.onchange=function(){S.vol=+vol.value;save();render();};
['hasdens','hasform'].forEach(function(id){var c=document.getElementById(id);c.checked=!!S[id];c.onchange=function(){S[id]=c.checked;save();render();};});
[].forEach.call(document.querySelectorAll('th'), function(th){
  if(th.dataset.k==='none') return;
  th.onclick=function(){ if(S.k===th.dataset.k) S.dir=-S.dir; else {S.k=th.dataset.k; S.dir=(th.dataset.k==='coin')?1:-1;} save(); render(); };
});
var C={sym:null,tf:'15m'};
function openChart(sym,tf){
  C.sym=sym; C.tf=tf||C.tf;
  document.getElementById('ctitle').textContent=sym.replace(/USDT$/,'')+' / USDT';
  document.getElementById('cbin').href='https://www.binance.com/ru/futures/'+sym;
  [].forEach.call(document.querySelectorAll('#ctf button'),function(b){b.classList.toggle('on',b.dataset.v===C.tf);});
  document.getElementById('cframe').src='structures.html#tf='+encodeURIComponent(C.tf)+'&sym='+encodeURIComponent(sym)+'&embed=1';
  document.getElementById('chart').classList.add('open'); paused=true;
}
function closeChart(){ document.getElementById('chart').classList.remove('open'); document.getElementById('cframe').src='about:blank'; paused=false; }
document.getElementById('tb').addEventListener('click',function(e){
  var tr=e.target.closest('tr[data-sym]'); if(!tr) return;
  var chip=e.target.closest('.f[data-tf]');
  openChart(tr.dataset.sym, chip?chip.dataset.tf:null);
});
[].forEach.call(document.querySelectorAll('#ctf button'),function(b){ b.onclick=function(){ openChart(C.sym,b.dataset.v); }; });
document.getElementById('cx').onclick=closeChart;
document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeChart(); });
var paused=false;
render();
setInterval(function(){ if(!paused) location.reload(); }, 60000);
})();
</script>
</body>
</html>
