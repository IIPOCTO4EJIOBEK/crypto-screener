<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Крипто-скринер</title>
<style>
:root{
  --bg:#0d1117; --panel:#161b22; --panel2:#1b2230; --line:#2a3140;
  --fg:#e6edf3; --muted:#8f9bab; --accent:#4c9aff;
  --long:#3fb950; --short:#f85149; --warn:#d29922; --chip:#1f2733;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: light){
  :root{
    --bg:#f6f8fa; --panel:#ffffff; --panel2:#eef1f5; --line:#d6dde5;
    --fg:#1b2430; --muted:#5b6673; --accent:#0a66c2;
    --long:#1a7f37; --short:#c62828; --warn:#9a6700; --chip:#eaeef3;
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden}
body{
  background:var(--bg); color:var(--fg);
  font:14px/1.45 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  padding:12px 12px 40px;
}
.wrap{max-width:1180px;margin:0 auto}
h1,h2,h3{margin:0}
a{color:var(--accent)}
header{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:flex-start;
  justify-content:space-between}
.h1{font-size:21px;font-weight:650;letter-spacing:.2px}
.sub{color:var(--muted);font-size:12.5px;margin:5px 0 0}
.sub b{color:var(--fg);font-weight:600}
section{margin:16px 0 0}
h2.sec{font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);
  font-weight:600;margin:0 0 7px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:10px 11px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{background:var(--chip);border:1px solid var(--line);border-radius:20px;
  padding:3px 9px;font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.chip b{color:var(--fg);margin-left:4px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.pos{color:var(--long)}
.neg{color:var(--short)}
.nowrap{white-space:nowrap}
/* --- первый экран: числа измерения --- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(116px,1fr));
  gap:8px;margin:0}
.tile{background:var(--panel2);border:1px solid var(--line);border-radius:10px;
  padding:9px 10px;min-width:0}
.tile .k{font-size:11px;color:var(--muted);line-height:1.25;overflow-wrap:anywhere}
.tile .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:27px;
  font-weight:650;line-height:1.15;margin-top:3px}
.tile .s{font-size:10.5px;color:var(--muted);margin-top:3px;line-height:1.3;
  overflow-wrap:anywhere}
.honesty{border-left:3px solid var(--warn);background:var(--panel2);border-radius:8px;
  padding:9px 11px;margin:0 0 9px}
.honesty .t{font-weight:650;font-size:13.5px;color:var(--warn);margin-bottom:4px}
.honesty p{margin:0;font-size:12.5px;color:var(--muted)}
.honesty p b{color:var(--fg);font-weight:600;font-family:var(--mono)}
.survivor{border:1px solid var(--line);border-left:3px solid var(--long);
  background:var(--panel2);border-radius:10px;padding:10px 12px}
.sv-head{display:flex;flex-wrap:wrap;gap:6px 9px;align-items:baseline}
.sv-kind{font-size:15px;font-weight:650}
.sv-tf{font-family:var(--mono);color:var(--muted);font-weight:500}
.kvs{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0 0}
.kv{background:var(--chip);border:1px solid var(--line);border-radius:6px;
  padding:2px 7px;font-size:11.5px;color:var(--muted);overflow-wrap:anywhere}
.kv b{color:var(--fg);font-family:var(--mono);font-weight:600;margin-left:4px}
.noform{border:1px dashed var(--line);border-radius:9px;padding:10px 11px;
  font-size:12.5px;color:var(--fg);background:var(--panel2)}
.tag{display:inline-block;border-radius:5px;padding:0 5px;font-size:10.5px;
  border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.yes{color:var(--long);border-color:var(--long)}
.tag.no{color:var(--muted)}
.tag.skip{color:var(--warn);border-color:var(--warn)}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);
  border-radius:10px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th{position:sticky;top:0;background:var(--panel2);color:var(--muted);font-weight:600;
  text-align:right;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap;
  cursor:pointer;user-select:none;-webkit-user-select:none}
th.l{text-align:left}
th.sorted{color:var(--accent)}
th.sorted.asc::after{content:' ▲';font-size:9px}
th.sorted.desc::after{content:' ▼';font-size:9px}
td{padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap;
  text-align:right;vertical-align:middle;font-variant-numeric:tabular-nums}
td.l{text-align:left}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--panel2)}
tr.nosup td{color:var(--muted)}
.cards{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:820px){.cards{grid-template-columns:1fr 1fr}}
a.card{display:block;text-decoration:none;color:inherit;background:var(--panel);
  border:1px solid var(--line);border-radius:12px;padding:11px 12px;min-width:0}
a.card:hover{border-color:var(--accent)}
.card h3{font-size:15px;font-weight:650;margin:0 0 5px}
.card p.what{margin:0;font-size:12.5px;color:var(--muted)}
.figs{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0 0}
.fig{background:var(--chip);border:1px solid var(--line);border-radius:6px;
  padding:2px 7px;font-size:11.5px;color:var(--fg);overflow-wrap:anywhere}
.card p.cnote{margin:7px 0 0;font-size:11px;color:var(--muted)}
.card .go{margin:8px 0 0;font-size:11.5px;color:var(--accent)}
.note{font-size:11.5px;color:var(--muted);margin:6px 0 0}
ol.cl{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--line);
  border-radius:10px;margin:0;padding:9px 11px 9px 30px;font-size:12.5px;color:var(--muted)}
ol.cl li{margin:4px 0}
ol.gaps{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin:0;
  padding:9px 11px 9px 30px;font-size:12.5px;color:var(--muted)}
ol.gaps li{margin:3px 0}
ul.docs{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px 14px;
  font-size:12.5px}
footer{margin:20px 0 0;padding-top:10px;border-top:1px solid var(--line);
  font-size:11.5px;color:var(--muted);line-height:1.65}
footer b{color:var(--fg);font-weight:600}
footer .fk{color:var(--fg)}
@media (max-width:700px){
  body{padding:10px 10px 32px}
  .h1{font-size:18px}
  .tile .v{font-size:23px}
  table{font-size:12px}
  th,td{padding:6px 6px}
  th{white-space:normal;line-height:1.2}
}
</style>
</head>

<script>
(function(){
"use strict";

/* ---------- данные, вшитые в файл сборщиком ---------- */
var DATA = null;
try { DATA = JSON.parse(document.getElementById('data').textContent); }
catch(e){ DATA = null; }
if(!DATA || typeof DATA !== 'object'){
  document.getElementById('boot').textContent =
    'Данные в файл не вшиты или не разобрались: страница собрана без JSON.';
  return;
}

var M = DATA.meta || {};
var MS = DATA.measurement || {};
var CARDS = DATA.cards || [];
var DOCS = DATA.docs || [];
var CAVEATS = M.caveats || [];
var GAPS = M.gaps || [];

/* ---------- помощники: текст и числа ---------- */
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function fin(v){ return typeof v === 'number' && isFinite(v); }
/* строка как есть; отсутствующее — прочерк, а не пустота и не выдумка */
function tx(v){ return (v == null || v === '') ? '—' : String(v); }
function n0(v){
  if(!fin(v)) return '—';
  var neg = v < 0, s = String(Math.round(Math.abs(v))), out = '';
  while(s.length > 3){ out = ' ' + s.slice(-3) + out; s = s.slice(0, -3); }
  return (neg ? '-' : '') + s + out;
}
function fixed(v, d){
  if(!fin(v)) return '—';
  return Number(v).toFixed(d == null ? 2 : d);
}
function sgn(v, d){
  if(!fin(v)) return '—';
  return (v > 0 ? '+' : '') + Number(v).toFixed(d == null ? 2 : d);
}
function pct(v, d){ return fin(v) ? Number(v).toFixed(d == null ? 1 : d) + ' %' : '—'; }
/* знак значения — только цвет, само число не меняется */
function signCls(v){ return !fin(v) ? '' : (v > 0 ? 'pos' : (v < 0 ? 'neg' : '')); }
function plural(n, one, few, many){
  var a = Math.abs(Math.round(n)) % 100, b = a % 10;
  if(a > 10 && a < 20) return many;
  if(b > 1 && b < 5) return few;
  if(b === 1) return one;
  return many;
}
function el(id){ return document.getElementById(id); }
function setHTML(id, html){ el(id).innerHTML = html; }

/* ---------- шапка ---------- */
(function(){
  el('hTitle').textContent = tx(M.title);
  var s = [];
  if(M.subtitle) s.push(tx(M.subtitle));
  if(M.built_at) s.push('сборка ' + tx(M.built_at));
  if(M.market) s.push(tx(M.market));
  el('hSub').textContent = s.join(' · ');

  var ch = [];
  if(M.no_signals === true) ch.push('сигналов не даёт и доходности не обещает');
  if(M.window && fin(M.window.days)){
    ch.push('окно ' + n0(M.window.days) + ' ' +
            plural(M.window.days, 'сутки', 'суток', 'суток'));
  }
  setHTML('hChips', ch.map(function(c){
    return '<span class="chip">' + esc(c) + '</span>';
  }).join(''));
})();

/* ---------- первый экран: числа измерения ---------- */
(function(){
  /* главное сообщение — то самое неудобное; формулировка из оговорок */
  var h = '<div class="t">После издержек большинство формаций в минусе</div>';
  var p = [];
  if(fin(MS.rows_positive) && fin(MS.rows_total)){
    p.push('В плюсе после издержек — <b>' + n0(MS.rows_positive) + '</b> строки из <b>' +
           n0(MS.rows_support) + '</b> строк-опор (в таблице ' + n0(MS.rows_total) + ').');
  }
  if(fin(MS.rows_significant) && fin(MS.rows_significant_positive)){
    p.push('Значимых после поправки на перебор — <b>' + n0(MS.rows_significant) +
           '</b>, из них с плюсом — <b>' + n0(MS.rows_significant_positive) + '</b>.');
  }
  if(!p.length) p.push('Числа измерения в данных отсутствуют.');
  h += '<p>' + p.join(' ') + '</p>';
  setHTML('honesty', h);

  var T = [
    {k:'Строк измерения', v:MS.rows_total, s:'строк в таблице измерения'},
    {k:'Из них опора', v:MS.rows_support,
     s: fin(MS.min_trades) ? 'выборка от ' + n0(MS.min_trades) + ' сделок'
                           : 'строки-опоры'},
    {k:'В плюсе после издержек', v:MS.rows_positive,
     s:'среди строк-опор R больше нуля',
     c:true},
    {k:'Значимо после поправки', v:MS.rows_significant,
     s:'поправка на множественные сравнения'},
    {k:'Значимо и в плюсе', v:MS.rows_significant_positive,
     s:'пережила и издержки, и поправку', c:true}
  ];
  setHTML('tiles', T.map(function(t){
    var cls = 'tile' + (t.c ? ' ' + signCls(t.v) : '');
    return '<div class="' + cls + '">' +
      '<div class="k">' + esc(t.k) + '</div>' +
      '<div class="v">' + n0(t.v) + '</div>' +
      '<div class="s">' + esc(t.s) + '</div>' +
    '</div>';
  }).join(''));

  /* подпись к числам: что именно посчитано */
  var cp = [];
  if(fin(MS.rows_total) && fin(MS.symbols_n) && fin(MS.tfs_n)){
    cp.push('Измерение формаций — ' + n0(MS.rows_total) + ' строк по ' +
            n0(MS.symbols_n) + ' монетам и ' + n0(MS.tfs_n) + ' таймфреймам' +
            (MS.measured_on ? ', дата ' + tx(MS.measured_on) : '') + '.');
  }
  if(fin(MS.min_trades)){
    cp.push('Опорой считается выборка от ' + n0(MS.min_trades) +
            ' сделок: у меньших оценка разброса не определена.');
  }
  cp.push('Поправка на множественные сравнения (Бенджамини-Хохберг) применена; ' +
          'считаются только строки-опоры.');
  cp.push('Строка «в счёт не вошла» — это не то же самое, что «не значимо»: ' +
          'поправка на неё не смотрела.');
  el('heroCaption').innerHTML = cp.map(esc).join(' ');
})();

/* ---------- единственная выжившая строка ---------- */
(function(){
  var s = MS.survivor;
  if(s == null || typeof s !== 'object'){
    setHTML('survivor', '<div class="noform">Выживших нет: ни одной строки, ' +
      'которая осталась бы в плюсе после издержек и пережила поправку на ' +
      'перебор, в этом измерении не нашлось.</div>');
    return;
  }
  var badges = [];
  if(s.support === true) badges.push('<span class="tag yes">опора</span>');
  if(s.support === false) badges.push('<span class="tag no">не опора</span>');
  if(s.significant === true) badges.push('<span class="tag yes">значимо после поправки</span>');
  if(s.significant === false) badges.push('<span class="tag no">не значимо</span>');
  if(s.significant == null) badges.push('<span class="tag skip">в счёт не вошла</span>');

  var kv = [];
  kv.push('<span class="kv">сделок<b>' + n0(s.n) + '</b></span>');
  kv.push('<span class="kv">прибыльных<b>' + pct(s.win_pct, 1) + '</b></span>');
  kv.push('<span class="kv">R до издержек<b>' + sgn(s.r_gross, 3) + '</b></span>');
  kv.push('<span class="kv">издержки, R<b>' + fixed(s.cost_r, 3) + '</b></span>');
  kv.push('<span class="kv">R после издержек<b class="' + signCls(s.r_net) + '">' +
          sgn(s.r_net, 3) + '</b></span>');

  setHTML('survivor', '<div class="survivor">' +
    '<div class="sv-head">' +
      '<span class="sv-kind">' + esc(tx(s.kind_ru)) + '</span>' +
      '<span class="sv-tf">' + esc(tx(s.tf)) + '</span>' +
      badges.join('') +
    '</div>' +
    '<div class="kvs">' + kv.join('') + '</div>' +
    '<p class="note">Это единственная плюсовая строка, пережившая поправку на ' +
    'перебор. Ограничения измерения — в оговорках ниже.</p>' +
  '</div>');
})();

/* ---------- крупные выборки в минусе ---------- */
(function(){
  var L = MS.losers || [];
  if(!L.length){
    setHTML('losBody', '<tr><td class="l muted" colspan="4">' +
      'Строк с крупной выборкой в данных нет.</td></tr>');
    el('losNote').textContent = '';
    return;
  }
  setHTML('losBody', L.map(function(r){
    return '<tr>' +
      '<td class="l">' + esc(tx(r.kind_ru)) + '</td>' +
      '<td class="l mono">' + esc(tx(r.tf)) + '</td>' +
      '<td>' + n0(r.n) + '</td>' +
      '<td class="' + signCls(r.r_net) + '">' + sgn(r.r_net, 3) + '</td>' +
    '</tr>';
  }).join(''));
  el('losNote').textContent = 'Строки с наибольшей выборкой. Смысл блока: где ' +
    'данных больше всего, там как раз минус после издержек.';
})();

/* ---------- плитки-переходы ---------- */
(function(){
  if(!CARDS.length){
    setHTML('cards', '<div class="noform">Переходов в данных нет.</div>');
    el('cardsNote').textContent = '';
    return;
  }
  setHTML('cards', CARDS.map(function(c){
    var figs = (c.figures || []).map(function(f){
      return '<span class="fig">' + esc(tx(f)) + '</span>';
    }).join('');
    var head = '<h3>' + esc(tx(c.title)) + '</h3>';
    var what = c.what ? '<p class="what">' + esc(tx(c.what)) + '</p>' : '';
    var note = c.note ? '<p class="cnote">' + esc(tx(c.note)) + '</p>' : '';
    var inner = head + what +
      (figs ? '<div class="figs">' + figs + '</div>' : '') + note;
    var href = (c.href == null || c.href === '') ? '' : String(c.href);
    if(!href){
      return '<div class="card">' + inner + '</div>';
    }
    return '<a class="card" href="' + esc(href) + '">' + inner +
           '<p class="go">перейти →</p></a>';
  }).join(''));
  var withHref = 0;
  CARDS.forEach(function(c){ if(c.href) withHref++; });
  if(withHref !== CARDS.length){
    el('cardsNote').textContent = 'У части плиток адреса в данных нет — они ' +
      'показаны без ссылки.';
  } else {
    el('cardsNote').textContent = '';
  }
})();

/* ---------- полная таблица измерения ---------- */
(function(){
  var COLS = [
    {k:'kind', t:'Формация', l:true,
     sv:function(r){ return r.kind_ru == null ? null : String(r.kind_ru); },
     cell:function(r){ return '<td class="l">' + esc(tx(r.kind_ru)) + '</td>'; }},
    {k:'tf', t:'ТФ', l:true,
     sv:function(r){ return r.tf == null ? null : String(r.tf); },
     cell:function(r){ return '<td class="l mono">' + esc(tx(r.tf)) + '</td>'; }},
    {k:'n', t:'Сделок',
     sv:function(r){ return fin(r.n) ? r.n : null; },
     cell:function(r){ return '<td>' + n0(r.n) + '</td>'; }},
    {k:'win', t:'Прибыльных',
     sv:function(r){ return fin(r.win_pct) ? r.win_pct : null; },
     cell:function(r){ return '<td>' + pct(r.win_pct, 1) + '</td>'; }},
    {k:'rg', t:'R до издержек',
     sv:function(r){ return fin(r.r_gross) ? r.r_gross : null; },
     cell:function(r){
       return '<td class="' + signCls(r.r_gross) + '">' + sgn(r.r_gross, 3) + '</td>';
     }},
    {k:'cost', t:'Издержки, R',
     sv:function(r){ return fin(r.cost_r) ? r.cost_r : null; },
     cell:function(r){ return '<td>' + fixed(r.cost_r, 3) + '</td>'; }},
    {k:'rn', t:'R после издержек',
     sv:function(r){ return fin(r.r_net) ? r.r_net : null; },
     cell:function(r){
       return '<td class="' + signCls(r.r_net) + '">' + sgn(r.r_net, 3) + '</td>';
     }},
    {k:'sup', t:'Опора', l:true,
     sv:function(r){ return r.support === true ? 1 : (r.support === false ? 0 : null); },
     cell:function(r){
       if(r.support === true) return '<td class="l"><span class="tag yes">опора</span></td>';
       if(r.support === false) return '<td class="l"><span class="tag no">не опора</span></td>';
       return '<td class="l"><span class="tag no">—</span></td>';
     }},
    {k:'sig', t:'Значимость', l:true,
     sv:function(r){
       return r.significant === true ? 1 : (r.significant === false ? 0 : null);
     },
     cell:function(r){
       if(r.significant === true) return '<td class="l"><span class="tag yes">значимо</span></td>';
       if(r.significant === false) return '<td class="l"><span class="tag no">не значимо</span></td>';
       if(r.significant == null) return '<td class="l"><span class="tag skip">в счёт не вошла</span></td>';
       return '<td class="l"><span class="tag no">—</span></td>';
     }}
  ];

  var ROWS = MS.table || [];
  var state = {key:'n', dir:-1};

  function colByKey(k){
    for(var i = 0; i < COLS.length; i++){ if(COLS[i].k === k) return COLS[i]; }
    return null;
  }
  function rowsSorted(){
    var rows = ROWS.slice();
    var col = colByKey(state.key);
    if(!col) return rows;
    rows.sort(function(a, b){
      var av = col.sv(a), bv = col.sv(b);
      var am = (av == null || (typeof av === 'number' && !isFinite(av)));
      var bm = (bv == null || (typeof bv === 'number' && !isFinite(bv)));
      if(am && bm) return 0;
      if(am) return 1;                 /* отсутствующее — всегда в конец */
      if(bm) return -1;
      if(av < bv) return -state.dir;
      if(av > bv) return state.dir;
      return 0;
    });
    return rows;
  }
  function render(){
    if(!ROWS.length){
      setHTML('tbody', '<tr><td class="l muted" colspan="' + COLS.length + '">' +
        'Строк измерения в данных нет.</td></tr>');
    } else {
      setHTML('tbody', rowsSorted().map(function(r){
        var cls = r.support === true ? '' : ' class="nosup"';
        return '<tr' + cls + '>' +
          COLS.map(function(c){ return c.cell(r); }).join('') + '</tr>';
      }).join(''));
    }
    var ths = el('thr').querySelectorAll('th');
    for(var i = 0; i < ths.length; i++){
      var th = ths[i];
      th.classList.remove('sorted');
      th.classList.remove('asc');
      th.classList.remove('desc');
      if(th.getAttribute('data-k') === state.key){
        th.classList.add('sorted');
        th.classList.add(state.dir > 0 ? 'asc' : 'desc');
      }
    }
  }

  setHTML('thr', COLS.map(function(c){
    return '<th class="' + (c.l ? 'l ' : '') + '" data-k="' + esc(c.k) + '">' +
      esc(c.t) + '</th>';
  }).join(''));

  var ths = el('thr').querySelectorAll('th');
  for(var i = 0; i < ths.length; i++){
    (function(th){
      th.addEventListener('click', function(){
        var k = th.getAttribute('data-k');
        if(state.key === k){
          state.dir = -state.dir;
        } else {
          state.key = k;
          state.dir = -1;
        }
        render();
      });
    })(ths[i]);
  }
  render();

  var p = ['Строк: ' + n0(ROWS.length) + ' из ' + n0(MS.rows_total) + '.'];
  p.push('Клик по заголовку — сортировка; повторный клик меняет сторону. ' +
         'Пустое значение («—») и «в счёт не вошла» при сортировке уходят в конец.');
  p.push('Приглушённая строка — не опора.');
  el('tblNote').textContent = p.join(' ');

  var q = [];
  if(MS.measured_on) q.push('измерено ' + tx(MS.measured_on));
  if(fin(MS.min_trades)) q.push('опора от ' + n0(MS.min_trades) + ' сделок');
  if(fin(MS.fdr_alpha)) q.push('alpha = ' + fixed(MS.fdr_alpha, 2));
  if(MS.scope) q.push('монеты: ' + tx(MS.scope));
  el('tblParams').textContent = q.length ? q.join(' · ') : '';
})();

/* ---------- оговорки ---------- */
(function(){
  if(!CAVEATS.length){
    setHTML('caveats', '<li>оговорок в данных нет</li>');
    return;
  }
  setHTML('caveats', CAVEATS.map(function(c){
    return '<li>' + esc(tx(c)) + '</li>';
  }).join(''));
})();

/* ---------- пропуски: блок появляется, только если они есть ---------- */
(function(){
  if(!GAPS.length) return;   /* пусто — блока нет в разметке вовсе */
  setHTML('gapsWrap', '<section><h2 class="sec">Чего не хватает</h2>' +
    '<ol class="gaps">' + GAPS.map(function(g){
      return '<li>' + esc(tx(g)) + '</li>';
    }).join('') + '</ol>' +
    '<p class="note">Это честный признак того, что часть данных не собралась.</p>' +
    '</section>');
})();

/* ---------- документы ---------- */
(function(){
  if(!DOCS.length){
    setHTML('docs', '<li class="muted">документов в данных нет</li>');
    return;
  }
  setHTML('docs', DOCS.map(function(d){
    var href = (d.href == null || d.href === '') ? '' : String(d.href);
    var title = esc(tx(d.title));
    if(!href) return '<li>' + title + '</li>';
    return '<li><a href="' + esc(href) + '">' + title + '</a></li>';
  }).join(''));
})();

/* ---------- подвал: окно измерения и на чём это собрано ---------- */
(function(){
  var W = M.window || {};
  var f = [];

  var w = [];
  if(W.start || W.end){
    w.push(tx(W.start) + ' … ' + tx(W.end));
  }
  if(fin(W.days)){
    w.push(n0(W.days) + ' ' + plural(W.days, 'сутки', 'суток', 'суток'));
  }
  if(fin(W.symbols_n)) w.push('монет ' + n0(W.symbols_n));
  if(fin(W.tfs_n)) w.push('таймфреймов ' + n0(W.tfs_n));
  if(w.length) f.push('<b>Окно измерения:</b> ' + esc(w.join(', ')) + '.');
  if(W.log) f.push('<b>Журнал сбора:</b> ' + esc(tx(W.log)) + '.');

  var live = M.live || {};
  function srcLine(name, obj, fields){
    if(!obj || typeof obj !== 'object') return null;
    var segs = [];
    fields.forEach(function(fl){
      var v = obj[fl[0]];
      if(fin(v)) segs.push(n0(v) + ' ' + fl[1]);
    });
    if(obj.collected_at) segs.push('снимок ' + tx(obj.collected_at));
    if(!segs.length) return null;
    return name + ' — ' + segs.join(', ');
  }
  var src = [];
  var a = srcLine('структуры', live.structures,
    [['pairs','пар'], ['tfs_n','таймфрейма'], ['formations','формаций'],
     ['candles','свечей']]);
  var b = srcLine('плотности', live.densities,
    [['coins','монет'], ['densities_total','плотностей'], ['shown','показано'],
     ['depth','глубина стакана']]);
  if(a) src.push(a);
  if(b) src.push(b);
  if(src.length) f.push('<b>На чём это собрано:</b> ' + esc(src.join('; ')) + '.');

  f.push('Числа вшиты в файл на момент сборки и не пересчитываются: страница ' +
         'в сеть не ходит и ничего не досчитывает.');
  setHTML('foot', f.join('<br>'));
})();

})();
</script>
